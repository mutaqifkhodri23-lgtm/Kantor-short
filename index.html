<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kantor Shorts</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1f3b;--floor:#262b52;--tile:#2d3360;--ink:#f3f0ff;--mute:#a7a3d0;--line:#0e1026;--ok:#5be3a0;--warn:#ffd25e;--bad:#ff7a8a;--btn:#ff9f43;--btnink:#2a1700;--card:#323968}
:root[data-theme="light"]{--bg:#e8f1ff;--floor:#d5e4fb;--tile:#c3d7f5;--ink:#1b1f3b;--mute:#4d557f;--line:#1b1f3b;--ok:#0f8f55;--warn:#a86a00;--bad:#c4263c;--btn:#ff9f43;--btnink:#2a1700;--card:#ffffff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#e8f1ff;--floor:#d5e4fb;--tile:#c3d7f5;--line:#1b1f3b;--ink:#1b1f3b;--mute:#4d557f;--ok:#0f8f55;--warn:#a86a00;--bad:#c4263c;--card:#ffffff}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pixelify Sans",ui-monospace,Menlo,monospace;font-size:16px;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:0 0 2px;font-weight:600}
.sub{color:var(--mute);margin:0 0 14px}
.box{border:3px solid var(--line);background:var(--card);box-shadow:4px 4px 0 var(--line);padding:12px}
form{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);padding:10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button{font:inherit;font-weight:600;cursor:pointer;color:var(--btnink);background:var(--btn);border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:8px 12px}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.floor{background:var(--floor);background-image:linear-gradient(var(--tile) 2px,transparent 2px),linear-gradient(90deg,var(--tile) 2px,transparent 2px);background-size:32px 32px;border:3px solid var(--line);padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;margin-bottom:18px}
.desk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-height:150px}
.bubble{min-height:38px;width:100%;font-size:13px;padding:4px 6px;background:var(--card);border:3px solid var(--line);color:var(--mute)}
.desk.on .bubble{color:var(--ink);border-color:var(--warn)}
.char{position:relative;width:36px;height:44px}
.char::before{content:"";position:absolute;left:6px;top:0;width:24px;height:20px;background:#ffd9b0;border:3px solid var(--line);border-bottom:0;box-shadow:inset 0 6px 0 var(--c)}
.char::after{content:"";position:absolute;left:0;top:20px;width:36px;height:24px;background:var(--c);border:3px solid var(--line)}
.desk.on .char{animation:bob .5s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.desk.on .char{animation:none}}
.table{width:88%;height:14px;background:#8a5a34;border:3px solid var(--line)}
.name{font-weight:600}
.role{font-size:13px;color:var(--mute)}
h2{font-size:19px;margin:0 0 8px}
.item{margin-bottom:12px}
.item b{display:block;word-break:break-word}
.tag{font-size:14px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.row{display:flex;gap:8px;margin-top:8px}
.row .no{background:var(--card);color:var(--ink)}
.empty{color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin-top:16px}
</style>
</head>
<body>
<main>
<h1>Kantor Shorts</h1>
<p class="sub">Ketik topik, tim AI mengerjakan sampai video siap kamu setujui.</p>

<form id="f">
  <input id="t" placeholder="Contoh: fakta unik luar angkasa" maxlength="80" aria-label="Topik video" required>
  <button type="submit">Buat video</button>
</form>

<section class="floor" id="floor" aria-label="Meja tim"></section>

<section class="box">
  <h2>Antrean video</h2>
  <div id="q"><span class="empty">Belum ada video. Ketik topik di atas untuk mulai.</span></div>
</section>

<p class="note" id="conn">Menghubungkan ke database...</p>
</main>

<script>
const SUPABASE_URL="ISI_PROJECT_URL";
const SUPABASE_KEY="ISI_ANON_KEY";
const WEBHOOK_URL="";
const AG=[
 {id:"riset",n:"Riset",r:"Cari tren topik",c:"#4cc9f0"},
 {id:"penulis",n:"Penulis",r:"Tulis naskah",c:"#f72585"},
 {id:"suara",n:"Suara",r:"Rekam narasi",c:"#b5e48c"},
 {id:"editor",n:"Editor",r:"Render video",c:"#ffd166"},
 {id:"publisher",n:"Publisher",r:"Siapkan upload",c:"#9d8cff"}
];
let agents={},videos=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(t,q){
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+t+"?"+q,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
 if(!r.ok)throw new Error("Kode "+r.status);
 return r.json();
}
function floor(){
 $("floor").innerHTML=AG.map(a=>{const d=agents[a.id]||{};const on=!!d.working;
 return `<div class="desk ${on?"on":""}" style="--c:${a.c}"><div class="bubble">${esc(d.status||"Menunggu tugas")}</div><div class="char"></div><div class="table"></div><div class="name">${a.n}</div><div class="role">${a.r}</div></div>`}).join("");
}
function queue(){
 if(!videos.length){$("q").innerHTML='<span class="empty">Belum ada video. Ketik topik di atas untuk mulai.</span>';return}
 $("q").innerHTML=videos.map(v=>{
  let s="";
  if(v.status==="proses")s=`<span class="tag warn">Sedang dikerjakan: ${esc(v.stage)}</span>`;
  if(v.status==="approval")s=`<span class="tag warn">Menunggu persetujuanmu</span>${v.video_url?`<br><a href="${esc(v.video_url)}" target="_blank" rel="noopener" style="color:var(--ink)">Lihat video</a>`:""}<div class="row"><button data-a="approve" data-id="${v.id}">Setujui dan upload</button><button class="no" data-a="revise" data-id="${v.id}">Revisi</button></div>`;
  if(v.status==="upload")s='<span class="tag ok">Disetujui, masuk jadwal upload YouTube Shorts</span>';
  if(v.status==="revisi")s='<span class="tag bad">Sedang direvisi</span>';
  if(v.status==="gagal")s='<span class="tag bad">Gagal diproses</span>';
  return `<div class="item"><b>${esc(v.topic)}</b>${s}</div>`}).join("");
}
async function poll(){
 try{
  const [a,v]=await Promise.all([api("agents","select=*"),api("videos","select=*&order=created_at.desc&limit=20")]);
  agents={};a.forEach(x=>agents[x.id]=x);videos=v;
  $("conn").textContent="Terhubung ke database";
  floor();queue();
 }catch(e){
  $("conn").textContent="Belum terhubung ("+e.message+"). Cek Project URL dan anon key di index.html.";
  floor();
 }
}
async function hook(p){
 if(!WEBHOOK_URL){$("conn").textContent="Webhook n8n belum diisi. Kita pasang di tahap berikutnya.";return false}
 try{const r=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});if(!r.ok)throw 0;return true}
 catch(e){$("conn").textContent="Perintah gagal terkirim. Coba lagi.";return false}
}
$("f").addEventListener("submit",async e=>{
 e.preventDefault();
 const t=$("t").value.trim();if(!t)return;
 if(await hook({action:"create",topic:t})){$("t").value="";poll()}
});
$("q").addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(await hook({action:b.dataset.a,id:b.dataset.id}))poll();
});
floor();poll();setInterval(poll,3000);
</script>
</body>
</html>
